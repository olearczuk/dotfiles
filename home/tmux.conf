# Always split panes in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New windows always start in ~/code, regardless of the current pane's path
bind c new-window -c ~/code

set -g mouse on
set -g set-clipboard on

# ── Colours ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Dark bar, light text: far more contrast than the default green/black.
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 40
# Generous, so a long path is never clipped by the reservation itself.
set -g status-right-length 120

# Left: session name in a bold blue block.
set -g status-left "#[bg=colour33,fg=colour231,bold] #S #[bg=colour235,fg=colour33,nobold]▎"

# Right: location, then the clock.
#
# Location: current directory, prefixed with the git worktree name when the
# pane is inside a repo (see bin/tmux-status-path, which also supplies its own
# colours). Re-evaluated every status-interval seconds. It sits on its own
# raised block, mirroring the session block on the left, so that it never gets
# mistaken for the tail of the window list.
set -g status-right '#[fg=colour238]▕#[bg=colour236] #(~/code/dotfiles/bin/tmux-status-path "#{pane_current_path}" "#{session_name}") #[bg=colour235,fg=colour240] │ #[fg=colour250]%H:%M '

# Windows: inactive muted, active bold and inverted so it's unmistakable.
# The explicit nobold matters: the custom status-format below draws the entries
# back to back, so without it the active window's bold bleeds into its neighbour.
set -g window-status-separator ""
set -g window-status-format "#[fg=colour244,bg=colour235,nobold] #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format "#[fg=colour231,bg=colour238,bold] #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-activity-style "fg=colour214,bg=colour235"
set -g window-status-bell-style "fg=colour203,bg=colour235,bold"

# ── Wrapping window list ──────────────────────────────────────────────────────
# tmux has no wrapping window list: once the windows outgrow the bar it clips
# them, and the tail becomes invisible. bin/tmux-status-wrap instead packs the
# windows into rows, tags each window with its row in @srow, and sets `status`
# to the number of rows needed; each status-format line below renders only the
# windows tagged for it. A window with no @srow yet lands on the first row, so
# the list survives the script never having run.
%hidden ROW0="#{||:#{==:#{@srow},0},#{==:#{@srow},}}"
%hidden WIN="#[range=window|#{window_index}]#{T:window-status-format}#[norange]"
%hidden WIN_CUR="#[range=window|#{window_index}]#{T:window-status-current-format}#[norange]"

set -g status-format[0] "#[align=left range=left]#{T;=/#{status-left-length}:status-left}#[norange]#{W:#{?${ROW0},${WIN},},#{?${ROW0},${WIN_CUR},}}#[align=right range=right]#{T;=/#{status-right-length}:status-right}#[norange]"
set -g status-format[1] "#[align=left]#{W:#{?#{==:#{@srow},1},${WIN},},#{?#{==:#{@srow},1},${WIN_CUR},}}"
set -g status-format[2] "#[align=left]#{W:#{?#{==:#{@srow},2},${WIN},},#{?#{==:#{@srow},2},${WIN_CUR},}}"
set -g status-format[3] "#[align=left]#{W:#{?#{==:#{@srow},3},${WIN},},#{?#{==:#{@srow},3},${WIN_CUR},}}"
set -g status-format[4] "#[align=left]#{W:#{?#{==:#{@srow},4},${WIN},},#{?#{==:#{@srow},4},${WIN_CUR},}}"

# Anything that can change how much the list needs: the window set, a name (so
# also every automatic-rename), the terminal size, or which client is looking.
set-hook -g client-attached        { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g client-detached        { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g client-resized         { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g client-session-changed { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g window-linked          { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g window-unlinked        { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g window-renamed         { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
set-hook -g after-resize-pane      { run-shell -b "~/code/dotfiles/bin/tmux-status-wrap" }
run-shell -b "~/code/dotfiles/bin/tmux-status-wrap"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour33"

# ── Messages / command prompt ─────────────────────────────────────────────────
set -g message-style "bg=colour33,fg=colour231,bold"
set -g message-command-style "bg=colour238,fg=colour231"
set -g mode-style "bg=colour33,fg=colour231"

# ── Misc quality of life ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g display-time 2000

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
